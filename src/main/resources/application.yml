spring:
  application:
    name: binsathi-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/binsathi}
    username: ${DB_USER:binsathi}
    password: ${DB_PASSWORD:binsathi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info