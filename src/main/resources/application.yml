spring:
  application:
    name: binsathi-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/binsathi}
    username: ${DB_USER:binsathi}
    password: ${DB_PASSWORD:binsathi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Local default only. Production must set JWT_SECRET as an environment variable.
    secret: ${JWT_SECRET:dev-only-secret-please-change-0123456789abcdef}
    access-minutes: 15
    refresh-days: 30